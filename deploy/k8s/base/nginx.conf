# Same-Pod reverse-proxy sidecar for hermes-finance.
#
# The finance container binds 127.0.0.1:8765 (proxy mode refuses any other bind). This sidecar shares the Pod's network
# namespace, so it reaches the app over loopback, and is the ONLY container the Kubernetes Service targets. It does not
# authenticate: it forwards the request the edge (Traefik + Authelia) already authenticated. Trust therefore rests on
# two things the manifests and deploy/README.md establish:
#   * the edge strips any inbound Remote-* and repopulates Remote-User from the signed-in identity, and
#   * only the edge proxy can reach this Pod (NetworkPolicy + host firewall; fail closed otherwise).
#
# Runs as the unprivileged nginx user (nginxinc/nginx-unprivileged) on :8080. The app sees the request as "proxied"
# (the identity header and X-Forwarded-* are present) and keyed to the public Host, exactly as it expects behind a
# local forward-auth proxy.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log /dev/stdout;
    # Writable temp paths for the unprivileged user (read-only root filesystem friendly).
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # A page load pulls ~2 dozen assets; a base64 import can be ~15 MB (MAX_IMPORT_BODY).
    client_max_body_size 20m;
    proxy_read_timeout 120s;

    upstream finance_app { server 127.0.0.1:8765; keepalive 8; }

    server {
        listen 8080;
        server_name _;

        # Readiness/liveness target for the sidecar itself (never forwarded upstream).
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://finance_app;
            proxy_http_version 1.1;

            # Forward the public Host unchanged so the app keys the request to its configured public URL
            # (e.g. finance.example.invalid), never to localhost.
            proxy_set_header Host $host;

            # Mark the request as proxied and record the chain. The trusted Remote-User the edge set is forwarded
            # verbatim by nginx (it is a normal, dash-named request header); we do NOT add or rewrite it here.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;

            # Preserve the browser Origin so the app's CSRF/DNS-rebinding check passes for writes.
            proxy_set_header Origin $http_origin;
        }
    }
}
