apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-finance
spec:
  template:
    spec:
      # Pin to the node whose disk holds /home/basalisk/finance-data (the hostPath below is node-local).
      nodeSelector:
        kubernetes.io/hostname: 2ndbrain
      securityContext:
        runAsNonRoot: true
        # IMPORTANT: must equal the UID/GID that owns /home/basalisk/finance-data on the host (the user the host Hermes
        # plugin runs as), so the container and the host plugin share one finance.db and the 0700/0600 permissions hold.
        # Run `id -u basalisk` / `id -g basalisk` on the node and set these; fsGroup is removed (see kustomization.yaml)
        # so kubelet never recursively chowns the shared host directory.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: finance
          env:
            # The edge's trusted identity header, the allowed login, and the public URL. No secret here; identity is
            # repopulated at the edge after inbound Remote-* is stripped (see deploy/README.md).
            - name: FINANCE_PROXY_HEADER
              value: "Remote-User"
            - name: FINANCE_ALLOWED_USERS
              value: "jon"
            - name: FINANCE_PUBLIC_URLS
              value: "https://money.basalisk.net"
      volumes:
        # Replace the base emptyDir with the shared host directory. One finance.db for the host Hermes plugin and the
        # containerised app. The host directory is created 0700 and owned by the host user; the app keeps files 0600.
        - name: data
          emptyDir: null
          hostPath:
            path: /home/basalisk/finance-data
            type: Directory
