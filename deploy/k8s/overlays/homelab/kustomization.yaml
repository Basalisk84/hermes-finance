apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Homelab overlay: pins the generic base to the real node, shared volume, proxy identity and network restriction for
# https://money.basalisk.net. No secret is present in Git, a ConfigMap, an image layer, or a command argument.
namespace: finance

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: patch-deployment.yaml
  - path: patch-networkpolicy.yaml
  # Remove the base fsGroup so kubelet never recursively chowns the shared hostPath directory; ownership is matched by
  # runAsUser/runAsGroup instead (see patch-deployment.yaml).
  - target:
      kind: Deployment
      name: hermes-finance
    patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/fsGroup
