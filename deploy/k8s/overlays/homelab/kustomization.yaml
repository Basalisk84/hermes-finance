apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Homelab overlay: pins the generic base to a node, a shared volume, a proxy identity and a network restriction for a
# reverse-proxied deployment. The node name, hostPath, allowed user, public URL and edge CIDR here are placeholder
# EXAMPLE values — copy this overlay to an untracked local overlay and fill in your real values (see deploy/README.md).
# No secret is present in Git, a ConfigMap, an image layer, or a command argument.
namespace: finance

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: patch-deployment.yaml
  - path: patch-networkpolicy.yaml
  # Remove the base fsGroup so kubelet never recursively chowns the shared hostPath directory; ownership is matched by
  # runAsUser/runAsGroup instead (see patch-deployment.yaml).
  - target:
      kind: Deployment
      name: hermes-finance
    patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/fsGroup
